name: Build, Verify & Deploy Mobile Builds

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backend-tests:
    name: Laravel Backend PHPUnit Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite, bcmath

      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run Automated Backend Tests
        run: php artisan test --without-tty

  android-build-and-store-deploy:
    name: Android APK / Play Store Internal Track
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android Unit Tests & Build APK + AAB
        env:
          ARCA_API_BASE_URL: ${{ secrets.ARCA_API_BASE_URL || 'https://api.arca.app' }}
          REVENUECAT_ANDROID_PUBLIC_KEY: ${{ secrets.REVENUECAT_ANDROID_PUBLIC_KEY || 'goog_replace_with_key' }}
        run: ./gradlew testDebugUnitTest assembleDebug bundleRelease --no-daemon

      - name: Copy Debug APK for Instant Phone Download
        run: cp app/build/outputs/apk/debug/app-debug.apk ../Arca-debug.apk

      - name: Publish Instant Phone Download to GitHub Releases (latest-build)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: "Arca Latest Mobile Build (Auto-Updated on Push)"
          body: |
            Automated build from commit `${{ github.sha }}`.
            - **1-Tap Android Install (Anywhere on 5G/Wi-Fi)**: Download `Arca-debug.apk` below.
          files: |
            Arca-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Google Play Store (Internal Testing Track)
        if: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: app.arca.personalrecords
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: internal
          status: completed
